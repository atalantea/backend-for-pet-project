[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-app-backend"
version = "0.1.0"
description = "Todo app backend on FastAPI"
requires-python = ">=3.15"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "greenlet",
    "mypy",
    "pre-commit",
    "psycopg",
    "pydantic-settings",
    "pip",
    "pytest-asyncio",
    "ruff",
    "setuptools",
    "uvicorn",
    "sqlalchemy",
]

[tool.setuptools.packages.find]
include = ["app*"]  # Указываем, что пакет называется `app`

[tool.ruff]
target-version = "py315"
line-length = 88
indent-width = 4
exclude = [
    "alembic", 
    "__pycache__", 
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.mypy]
files = ["app"]
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]
# asyncio_mode = "auto"